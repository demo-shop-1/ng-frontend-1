<div class="app-theme">
  <button
    matIconButton
    matTooltip="{{ 'theme.tooltip' | translate }}"
    [mat-menu-trigger-for]="themeMenu"
  >
    <mat-icon>
      @switch (theme()) { @case ('light') {
      {{ 'light_mode' }}
      } @case ('dark') {
      {{ 'dark_mode' }}
      } @case ('auto') {
      {{ 'desktop_windows' }}
      } }
    </mat-icon>
  </button>
  <mat-menu #themeMenu="matMenu">
    <button
      [class.mat-menu__item--selected]="theme() === 'auto'"
      mat-menu-item
      (click)="setTheme('auto')"
      aria-label="Set default system theme"
    >
      <mat-icon>desktop_windows</mat-icon>
      <span>{{ 'theme.system' | translate }}</span>
    </button>
    <button
      [class.mat-menu__item--selected]="theme() === 'dark'"
      mat-menu-item
      (click)="setTheme('dark')"
      aria-label="Set dark theme"
    >
      <mat-icon>dark_mode</mat-icon>
      <span>{{ 'theme.dark' | translate }}</span>
    </button>
    <button
      [class.mat-menu__item--selected]="theme() === 'light'"
      mat-menu-item
      (click)="setTheme('light')"
      aria-label="Set light theme"
    >
      <mat-icon>light_mode</mat-icon>
      <span>{{ 'theme.light' | translate }}</span>
    </button>
  </mat-menu>
</div>
