<mat-card class="example-card" appearance="outlined">
  <img mat-card-image [src]="image()" alt="Photo of a product" />
  <mat-card-content>
    <p>
      {{ description() }}
    </p>
  </mat-card-content>
  <mat-card-actions>
    @if(firstAction()){
    <button matButton>{{ firstAction() | currency }}</button>
    }
  </mat-card-actions>
</mat-card>
