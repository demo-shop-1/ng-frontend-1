<app-header-component></app-header-component>
<app-menu-component>
  <mat-grid-list cols="1" rowHeight="14rem" class="app-notfound">
    <mat-grid-tile>
      <mat-card appearance="outlined">
        <mat-card-header>
          <mat-card-title>404</mat-card-title>
          <mat-card-subtitle>{{ 'not-found.subtitle' | translate }}...</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <mat-progress-bar mode="indeterminate"></mat-progress-bar>
          <p>... {{ 'not-found.content' | translate }}.</p>
        </mat-card-content>
        <mat-card-actions>
          <a matButton="outlined" href="/" target="_self">{{ 'not-found.button' | translate }}</a>
        </mat-card-actions>
      </mat-card>
    </mat-grid-tile>
  </mat-grid-list>
</app-menu-component>
